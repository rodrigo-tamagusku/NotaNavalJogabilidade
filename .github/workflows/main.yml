name: Deploy to GitHub Pages

# Run workflow on every push to the master branch
on:
  push:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-to-github-pages:
    # use ubuntu latest image to run steps on
    runs-on: ubuntu-latest
    steps:
    # 1. Checkout the code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup .NET SDK
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Change this to '9.0.x' or your project's target .NET version

    # 3. Publish the Blazor project 
    - name: Publish .NET Core Project
      run: dotnet publish src/NotaNaval.slnx -c Release -o release --nologo

    # 4. Rewrite base href for GitHub Pages subfolder subdirectory
    - name: Change base-tag in index.html from / to NotaNavalJogabilidade
      run: sed -i 's/<base href="\/" \/>/<base href="\/NotaNavalJogabilidade\/" \/>/g' release/wwwroot/index.html

    # 5. Fix SPA Routing (Copy index.html to 404.html)
    # This tricks GitHub Pages into serving your Blazor app when a user refreshes an internal page
    - name: copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    # 6. Upload artifact for deployment
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'release/wwwroot'

    # 7. Deploy to GitHub Pages environment
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
